name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Ensure Consistent Debug Keystore
        run: |
          if [ ! -f app/debug-consistent.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/debug-consistent.keystore \
              -storepass rantingpohon \
              -alias rantingkey \
              -keypass rantingpohon \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=RantingPohon, OU=Dev, O=RantingPohon, L=ID, S=ID, C=ID"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/debug-consistent.keystore
            git commit -m "Add consistent debug keystore [skip ci]"
            git push
          fi

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RantingPohonTools-debug
          path: app/build/outputs/apk/debug/app-debug.apk
